name: EfficiencyHub CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup .NET Compiler
      uses: microsoft/setup-msbuild@v2

    - name: Compile AutoEfficiencyWatcher Daemon
      run: |
        csc /target:winexe /optimize+ /out:AutoEfficiencyWatcher.exe AutoEfficiencyWatcher.cs

    - name: Execute Full Automated Test Suite (82 Tests)
      run: |
        node tests/run_all_e2e.js
